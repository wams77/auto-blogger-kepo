name: Auto Blogger Bot Gosip K-Pop

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # PENTING: Memberikan izin ke GitHub Actions untuk memodifikasi file di repositori
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Buat file Token JSON & Service Account
        env:
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
          INDEXING_KEY: ${{ secrets.INDEXING_KEY }}
        run: |
          echo "$BLOGGER_TOKEN" > token.json
          echo "$INDEXING_KEY" > service_account.json

      - name: Jalankan Script Auto-Blogger
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: python main.py
        
      # PENTING: Mengirim (Push) file history.txt kembali ke repositori Anda
      - name: Simpan Riwayat History ke GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history.txt
          # Hanya melakukan commit jika ada perubahan pada history.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update riwayat postingan [skip ci]"
          git push
